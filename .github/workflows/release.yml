name: Build and Release APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Universal APK
        run: flutter build apk --release --build-name=2.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Build Split APKs (TVs, Older Devices, etc.)
        run: flutter build apk --split-per-abi --release --build-name=2.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Sign APKs
        run: |
          # Decode keystore
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > keystore.jks
          
          # Find Android build tools path
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          
          # Sign all generated release APKs
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            echo "Signing $apk..."
            $BUILD_TOOLS/apksigner sign --ks keystore.jks \
              --ks-pass pass:${{ secrets.SIGNING_STORE_PASSWORD }} \
              --key-pass pass:${{ secrets.SIGNING_KEY_PASSWORD }} \
              --ks-key-alias ${{ secrets.SIGNING_KEY_ALIAS }} \
              "$apk"
              
            # Rename the signed APK for clarity
            BASENAME=$(basename "$apk" -release.apk)
            mv "$apk" "build/app/outputs/flutter-apk/Atmos-$BASENAME-v2.0.${{ github.run_number }}.apk"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Atmos Release v2.0.${{ github.run_number }}
          body: |
            Automated Release from push to master.
            Run Number: ${{ github.run_number }}
            
            **Included APKs:**
            - `Atmos-app-v2.0.x.apk`: Universal APK (Works on everything, larger size)
            - `Atmos-app-arm64-v8a-v2.0.x.apk`: Modern 64-bit Android Phones
            - `Atmos-app-armeabi-v7a-v2.0.x.apk`: Android TVs, FireSticks, and Older Phones
            - `Atmos-app-x86_64-v2.0.x.apk`: Android Emulators and x86 Tablets
          files: build/app/outputs/flutter-apk/Atmos-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
