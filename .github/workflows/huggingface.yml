name: Deploy to Hugging Face Space

on:
  push:
    paths:
      - 'huggingface-space/**'
      - '.github/workflows/huggingface.yml'
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "bot@atmos.app"
          git config --global user.name "Atmos CI Bot"
          
          # Clone the Hugging Face Space repository
          git clone https://huggingface.co/spaces/nikhil1776/torrentindex hf_space
          
          # Copy the server files to the cloned space
          cp -r huggingface-space/* hf_space/
          
          # Navigate, commit, and push
          cd hf_space
          git add .
          git commit -m "Deploy from GitHub Actions: ${{ github.sha }}" || echo "No changes to commit"
          git push https://nikhil1776:$HF_TOKEN@huggingface.co/spaces/nikhil1776/torrentindex main --force
