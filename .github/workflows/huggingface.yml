name: Deploy Torrent Cache to Hugging Face

on:
  push:
    paths:
      - 'huggingface-space/**'
      - '.github/workflows/huggingface.yml'
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "bot@atmos.app"
          git config --global user.name "Atmos CI Bot"
          
          # Clone using token in URL (password auth is deprecated on HF)
          git clone https://nikhil1776:$HF_TOKEN@huggingface.co/spaces/nikhil1776/torrentindex hf_space || {
            echo "Clone failed — initializing fresh repo"
            mkdir -p hf_space
            cd hf_space
            git init
            git remote add origin https://nikhil1776:$HF_TOKEN@huggingface.co/spaces/nikhil1776/torrentindex
            cd ..
          }
          
          # Copy the server files
          cp -r huggingface-space/* hf_space/
          
          cd hf_space
          git add .
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Deploy torrent-cache: $(date -u +%Y-%m-%dT%H:%M:%SZ) | ${GITHUB_SHA:0:7}"
          git push https://nikhil1776:$HF_TOKEN@huggingface.co/spaces/nikhil1776/torrentindex main --force
